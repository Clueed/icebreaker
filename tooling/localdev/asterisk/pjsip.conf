; Local stand-in for sipgate. Browsers register over WebSocket; every call
; lands in the fake-pstn dialplan. There is no trunk, so nothing ever leaves
; this machine.

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

; --- templates ---------------------------------------------------------------

[webrtc-endpoint](!)
type = endpoint
context = fake-pstn
disallow = all
allow = opus,ulaw,alaw
webrtc = yes
dtls_auto_generate_cert = yes

[webrtc-aor](!)
type = aor
max_contacts = 5
remove_existing = yes

[userpass](!)
type = auth
auth_type = userpass

; --- accounts (username = password) -----------------------------------------

[dev](webrtc-endpoint)
auth = dev
aors = dev
[dev](webrtc-aor)
[dev](userpass)
username = dev
password = dev

[dev2](webrtc-endpoint)
auth = dev2
aors = dev2
[dev2](webrtc-aor)
[dev2](userpass)
username = dev2
password = dev2
