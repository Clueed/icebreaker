; Fake PSTN: the LAST DIGIT of the dialed number picks the outcome.
;
;   ...0, 5-9  rings 3s, answers, echoes your microphone until you hang up
;   ...1       busy (486)
;   ...2       rings 30s, nobody answers
;   ...3       answers, beeps for 10s, then the remote side hangs up
;   ...4       network failure (503 / congestion)
;
; e.g. base "+4930123" with extension "01" -> busy.

[fake-pstn]
exten => _+X.,1,Goto(${EXTEN:1},1)
exten => _X.,1,NoOp(fake call to ${EXTEN})
 same => n,Goto(fake-outcome,${EXTEN:-1},1)

[fake-outcome]
exten => 1,1,Ringing()
 same => n,Wait(2)
 same => n,Busy(5)

exten => 2,1,Ringing()
 same => n,Wait(30)
 same => n,Hangup(19)

exten => 3,1,Ringing()
 same => n,Wait(2)
 same => n,Answer()
 same => n,Playtones(440/300,0/700)
 same => n,Wait(10)
 same => n,Hangup()

exten => 4,1,Congestion(3)

exten => _X,1,Ringing()
 same => n,Wait(3)
 same => n,Answer()
 same => n,Echo()
